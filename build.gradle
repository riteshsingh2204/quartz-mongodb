buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'net.researchgate.release' version '2.8.1'
    id 'com.sourcemuse.mongo' version '2.0.0'       // newer, Java-17 friendly
}

allprojects {
    repositories { mavenCentral() }
    apply plugin: 'maven-publish'
    apply plugin: 'java'
}

apply plugin: 'eclipse'
apply plugin: 'groovy'
apply plugin: 'idea'
apply plugin: 'com.sourcemuse.mongo'

archivesBaseName = 'quartz-mongodb'

java {
    // Use Java 17 everywhere
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

jar {
    // expects gradle.properties to define: projectVersion=...
    archiveVersion = projectVersion
}

configurations {
    provided
    implementation.extendsFrom provided
}
sourceSets {
    main { compileClasspath += configurations.provided }
}

idea {
    module {
        scopes.PROVIDED.plus += [configurations.provided]
        downloadJavadoc = true
        downloadSources = true
    }
}

eclipse {
    classpath {
        downloadSources true
        downloadJavadoc true
    }
    jdt {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    // --- Runtime / compile ---
    implementation("org.quartz-scheduler:quartz:2.5.0")                // Quartz latest stable
    implementation("org.mongodb:mongodb-driver-sync:5.6.0")            // MongoDB Java driver (sync)
    implementation("commons-codec:commons-codec:1.19.0")
    implementation("org.apache.commons:commons-lang3:3.19.0")
    implementation("org.slf4j:slf4j-api:2.0.17")

    // If you truly need Apache HTTP components, prefer Core5:
    // implementation("org.apache.httpcomponents.core5:httpcore5:5.3.6")

    // --- Optional “provided” examples (keep if you need) ---
    compileOnly("org.clojure:clojure:1.11.3")

    // --- Test stack (Java 17 compatible) ---
    testImplementation(platform("org.junit:junit-bom:5.11.3"))
    testImplementation("org.junit.jupiter:junit-jupiter")

    // Groovy & Spock on Groovy 4 for JDK17
    testImplementation("org.apache.groovy:groovy-all:4.0.28")
    testImplementation("org.spockframework:spock-core:2.4-M6-groovy-4.0")

    // Simple SLF4J binding for tests
    testImplementation("org.slf4j:slf4j-simple:2.0.17")

    // These are no longer needed with Spock 2.x:
    // testRuntimeOnly("cglib:cglib-nodep:3.1")
    // testRuntimeOnly("org.objenesis:objenesis:2.1")

    // If you still use Joda-Time in tests, keep it but on latest:
    testImplementation("joda-time:joda-time:2.14.0")
}

test {
    useJUnitPlatform()
    beforeTest { descriptor ->
        logger.lifecycle("Running test \"${descriptor}\"")
    }
    // Always run tests (useful for race-condition checks)
    outputs.upToDateWhen { false }
}

// Embedded Mongo for tests (plugin v2 syntax remains compatible)
tasks.withType(Test) {
    runWithMongoDb = true
    mongo {
        journalingEnabled true
        port 27017
        logging 'console'
        mongoVersion 'PRODUCTION'
    }
}

// Managed Mongo outside test task if you use it manually
mongo {
    port 27017
    logging 'console'
    journalingEnabled true
}

// Publishing (sources & javadoc jars are auto-added via components.java)
publishing {
    publications {
        quartzMongoDB(MavenPublication) {
            groupId    = 'com.novemberain'
            artifactId = archivesBaseName
            version    = projectVersion
            from components.java
        }
    }
    // repositories {
    //   maven { url = uri("$buildDir/repo") }
    // }
}

release {
    scmAdapters = [net.researchgate.release.GitAdapter]
    git { pushToRemote = 'origin' }
    versionPropertyFile = 'gradle.properties'
}

// Guardrails: refuse vulnerable/old libs if pulled transitively
dependencies {
    constraints {
        implementation("org.quartz-scheduler:quartz:2.5.0") { because("CVE-2019-13990 fixed in ≥2.3.2") }
        implementation("org.mongodb:mongodb-driver-sync:5.6.0")
        implementation("org.slf4j:slf4j-api:2.0.17")
        implementation("commons-codec:commons-codec:1.19.0")
        implementation("org.apache.commons:commons-lang3:3.19.0")
    }
}
