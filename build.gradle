plugins {
    id 'net.researchgate.release' version '3.1.0'
    id 'com.sourcemuse.mongo' version '2.0.0'
    id 'maven-publish'
    id 'java'
    id 'groovy'
    id 'idea'
    id 'eclipse'
}

group = 'io.github.riteshsingh2204'
archivesBaseName = 'quartz-mongodb'
// version is read from gradle.properties

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
    withJavadocJar()
}

repositories { mavenCentral() }

// --- Optional "provided" scope (kept for compatibility) ---
configurations {
    provided
    implementation.extendsFrom provided
}
sourceSets {
    main { compileClasspath += configurations.provided }
}

// --- IDE helpers ---
idea {
    module {
        scopes.PROVIDED.plus += [configurations.provided]
        downloadJavadoc = true
        downloadSources = true
    }
}
eclipse {
    classpath {
        downloadSources true
        downloadJavadoc true
    }
    jdt {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// --- Dependencies (Java 17 friendly, current stable lines) ---
dependencies {
    implementation("org.quartz-scheduler:quartz:2.5.0")
    implementation("org.mongodb:mongodb-driver-sync:5.6.0")
    implementation("commons-codec:commons-codec:1.19.0")
    implementation("org.apache.commons:commons-lang3:3.19.0")
    implementation("org.slf4j:slf4j-api:2.0.17")
    implementation("org.apache.httpcomponents:httpclient:4.5.14")

    // Prefer HttpCore5 instead of legacy 4.x (uncomment if needed)
    // implementation("org.apache.httpcomponents.core5:httpcore5:5.3.6")

    compileOnly("org.clojure:clojure:1.11.3")

    testImplementation(platform("org.junit:junit-bom:5.11.3"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testImplementation("org.apache.groovy:groovy-all:4.0.28")
    testImplementation("org.spockframework:spock-core:2.3-groovy-4.0")
    testImplementation("org.slf4j:slf4j-simple:2.0.17")
    testImplementation("joda-time:joda-time:2.14.0") // only if your tests still use it
}

// Quiet Javadoc
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

// JUnit 5
test {
    useJUnitPlatform()
    beforeTest { d -> logger.lifecycle("Running test \"${d}\"") }
    outputs.upToDateWhen { false }
}

// Embedded Mongo (plugin v2)
tasks.withType(Test).configureEach {
    runWithMongoDb = true
    mongo {
        journalingEnabled true
        port 27017
        logging 'console'
        mongoVersion 'PRODUCTION'
    }
}

// ========= Strict per-environment publishing to GitHub Packages =========
// Select env: -PpublishEnv=dev|stage|prod  OR  PUBLISH_ENV env var (defaults to 'dev')
def publishEnv = (project.findProperty("publishEnv") ?: System.getenv("PUBLISH_ENV") ?: "dev").toString().toLowerCase()
def ENV = publishEnv.toUpperCase()

// Helper that fails hard if a required env var is missing
def req = { String name ->
    def v = System.getenv(name)
    if (!v) throw new GradleException("Missing environment variable: " + name + " (required for publishEnv=" + ENV + ")")
    return v
}

// No fallbacks: each env must provide its *own* values.
// Example var names you must set in CI/CSMS:
//  GPR_OWNER_DEV / GPR_REPO_DEV / GPR_USER_DEV / GPR_TOKEN_DEV
//  GPR_OWNER_STAGE / GPR_REPO_STAGE / GPR_USER_STAGE / GPR_TOKEN_STAGE
//  GPR_OWNER_PROD / GPR_REPO_PROD / GPR_USER_PROD / GPR_TOKEN_PROD
def owner = req("GPR_OWNER_${ENV}")
def repo = req("GPR_REPO_${ENV}")
def user = req("GPR_USER_${ENV}")
def token = req("GPR_TOKEN_${ENV}")

def repoUrl = "https://maven.pkg.github.com/${owner}/${repo}"

publishing {
    publications {
        quartzMongoDB(MavenPublication) {
            groupId = project.group
            artifactId = archivesBaseName
            version = project.version
            from components.java

            pom {
                name = 'Quartz MongoDB JobStore'
                packaging = 'jar'
                description = 'Fork of quartz-mongodb, modernized for Java 17 & latest libs.'
                url = "https://github.com/${owner}/${repo}"
                licenses {
                    license {
                        name = 'Apache License 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                scm {
                    url = "https://github.com/${owner}/${repo}"
                    connection = "scm:git:https://github.com/${owner}/${repo}.git"
                    developerConnection = "scm:git:git@github.com:${owner}/${repo}.git"
                }
            }
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri(repoUrl)
            credentials {
                username = user
                password = token
            }
            authentication { basic(BasicAuthentication) }
        }
    }
}

// Convenience tasks
tasks.register("publishDev") { dependsOn("publish"); doFirst { project.ext.set("publishEnv", "dev") } }
tasks.register("publishStage") { dependsOn("publish"); doFirst { project.ext.set("publishEnv", "stage") } }
tasks.register("publishProd") { dependsOn("publish"); doFirst { project.ext.set("publishEnv", "prod") } }

// Guardrails against old/vulnerable transitive versions
dependencies {
    constraints {
        implementation("org.quartz-scheduler:quartz:2.5.0")
        implementation("org.mongodb:mongodb-driver-sync:5.6.0")
        implementation("org.slf4j:slf4j-api:2.0.17")
        implementation("commons-codec:commons-codec:1.19.0")
        implementation("org.apache.commons:commons-lang3:3.19.0")
    }
}

release {
    scmAdapters = [net.researchgate.release.GitAdapter]
    versionPropertyFile = 'gradle.properties'
    git {
        requireBranch.set(/release-\d+\.\d+\.\d+/)
        pushOptions.set(["--force"])
    }
    pushReleaseVersionBranch = 'master'
}
